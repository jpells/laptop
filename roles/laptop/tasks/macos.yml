---
# Dock Behavior Settings
- name: Enable Dock autohide
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: bool
    value: "{{ laptop_dock_autohide }}"
  notify: Restart Dock
  tags:
    - macos

- name: Minimize windows into application icon
  community.general.osx_defaults:
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: "{{ laptop_dock_minimize_to_application }}"
  notify: Restart Dock
  tags:
    - macos

- name: Set Dock icon size
  community.general.osx_defaults:
    domain: com.apple.dock
    key: tilesize
    type: float
    value: "{{ laptop_dock_tilesize }}"
  notify: Restart Dock
  tags:
    - macos

- name: Hide recent applications in Dock
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: "{{ laptop_dock_show_recents }}"
  notify: Restart Dock
  tags:
    - macos

# Finder Settings
- name: Show hidden files in Finder
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllFiles
    type: bool
    value: "{{ laptop_finder_show_all_files }}"
  notify: Restart Finder
  tags:
    - macos

- name: Show all filename extensions
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: "{{ laptop_finder_show_extensions }}"
  notify: Restart Finder
  tags:
    - macos

- name: Set Finder default view style
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: "{{ laptop_finder_view_style }}"
  notify: Restart Finder
  tags:
    - macos

- name: Set folder new Finder windows open to
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: "{{ laptop_finder_new_window_target }}"
  notify: Restart Finder
  tags:
    - macos

- name: Set path for new Finder windows
  community.general.osx_defaults:
    domain: com.apple.finder
    key: NewWindowTargetPath
    type: string
    value: "{{ laptop_finder_new_window_target_path }}"
  notify: Restart Finder
  tags:
    - macos

- name: Reset per-folder Finder view overrides
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}/.DS_Store"
    state: absent
  loop: "{{ laptop_finder_view_reset_folders }}"
  notify: Restart Finder
  tags:
    - macos

- name: Show Finder path bar
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: "{{ laptop_finder_show_path_bar }}"
  notify: Restart Finder
  tags:
    - macos

- name: Show Finder status bar
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: "{{ laptop_finder_show_status_bar }}"
  notify: Restart Finder
  tags:
    - macos

- name: Check if Library folder is hidden
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/Library"
  register: laptop_library_stat
  when: laptop_finder_show_library
  tags:
    - macos

- name: Show Library folder in home directory
  ansible.builtin.command:
    cmd: chflags nohidden {{ ansible_facts.env.HOME }}/Library
  when:
    - laptop_finder_show_library
    - laptop_library_stat.stat.hidden | default(false)
  changed_when: true
  notify: Restart Finder
  tags:
    - macos

- name: Keep desktop icons arranged by name
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      plist="{{ ansible_facts.env.HOME }}/Library/Preferences/com.apple.finder.plist"
      current=$(/usr/libexec/PlistBuddy -c "Print :DesktopViewSettings:IconViewSettings:arrangeBy" "$plist" 2>/dev/null || echo "")
      if [ "$current" = "{{ laptop_desktop_arrange_by }}" ]; then
        echo "unchanged"
      else
        /usr/libexec/PlistBuddy \
          -c "Add :DesktopViewSettings dict" \
          -c "Add :DesktopViewSettings:IconViewSettings dict" \
          -c "Delete :DesktopViewSettings:IconViewSettings:arrangeBy" \
          "$plist" 2>/dev/null
        /usr/libexec/PlistBuddy -c "Add :DesktopViewSettings:IconViewSettings:arrangeBy string {{ laptop_desktop_arrange_by }}" "$plist"
        echo "changed"
      fi
  register: laptop_desktop_arrange_result
  changed_when: "laptop_desktop_arrange_result.stdout == 'changed'"
  notify: Restart Finder
  tags:
    - macos

# System UI Settings
- name: Disable automatic Light/Dark appearance switching
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleInterfaceStyleSwitchesAutomatically
    type: bool
    value: false
  tags:
    - macos

- name: Set interface style (Dark/Light mode)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      current=$(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode')
      desired="{{ 'true' if laptop_interface_style == 'Dark' else 'false' }}"
      if [ "$current" != "$desired" ]; then
        osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $desired"
        echo "changed"
      else
        echo "unchanged"
      fi
  register: laptop_interface_style_result
  changed_when: "laptop_interface_style_result.stdout == 'changed'"
  tags:
    - macos

# Spotlight Settings
- name: Add paths to Spotlight privacy exclusions
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      current=$(/usr/libexec/PlistBuddy -c "Print :Exclusions" ~/Library/Preferences/com.apple.Spotlight.plist 2>/dev/null || echo "")
      if ! echo "$current" | grep -q "{{ item }}"; then
        defaults write com.apple.Spotlight Exclusions -array-add '{"path"="{{ item }}";}'
        echo "added"
      else
        echo "exists"
      fi
  loop: "{{ laptop_spotlight_exclusions }}"
  register: laptop_spotlight_result
  changed_when: "laptop_spotlight_result.stdout == 'added'"
  tags:
    - macos

# Safari Settings
# Safari has been sandboxed since Mojave: it reads its prefs from the
# containerized plist below, not ~/Library/Preferences/com.apple.Safari.plist.
- name: Enable Safari Develop menu
  community.general.osx_defaults:
    path: ~/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari.plist
    key: IncludeDevelopMenu
    type: bool
    value: "{{ laptop_safari_develop_menu }}"
  tags:
    - macos

- name: Show Safari bookmarks bar
  community.general.osx_defaults:
    path: ~/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari.plist
    key: ShowFavoritesBar
    type: bool
    value: "{{ laptop_safari_show_bookmarks_bar }}"
  tags:
    - macos

# TextEdit Settings
- name: Set TextEdit default format to plain text
  community.general.osx_defaults:
    domain: com.apple.TextEdit
    key: RichText
    type: bool
    value: "{{ laptop_textedit_rich_text }}"
  tags:
    - macos

- name: Open untitled document at launch instead of Open panel
  community.general.osx_defaults:
    domain: com.apple.TextEdit
    key: NSShowAppCentricOpenPanelInsteadOfUntitledFile
    type: bool
    value: "{{ laptop_textedit_show_open_panel }}"
  tags:
    - macos
